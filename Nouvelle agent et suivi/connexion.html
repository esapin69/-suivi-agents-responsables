<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://responsable-api.esapin.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-zxXwxPfkJBqaT9SemS6OQghn/uXwsl7wSHWFe8Nr3j0='; script-src-attr 'none'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <title>Connexion · Portail GHE</title>
  <link rel="stylesheet" href="style.css?v=20260810-auth-1">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-mark" aria-hidden="true">GHE</div>
      <div class="kicker">Accès personnel</div>
      <h1 id="loginTitle">Connexion GHE</h1>
      <p>Entrez votre code personnel de 6 chiffres. Votre accueil affichera uniquement les rubriques autorisées pour votre ligne.</p>
      <form id="loginForm" class="login-form">
        <label for="accessCode">Code d’accès</label>
        <div class="code-field">
          <input id="accessCode" name="code" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" aria-describedby="codeHelp" required autofocus>
          <button id="toggleCode" type="button" aria-label="Afficher le code" aria-pressed="false">Afficher</button>
        </div>
        <small id="codeHelp">Six chiffres, sans espace.</small>
        <div id="loginStatus" class="status" role="status" aria-live="assertive"></div>
        <button id="loginButton" class="btn cyan login-submit" type="submit">Se connecter</button>
      </form>
      <p class="login-security">Une nouvelle saisie remplace la session précédente sur cet appareil.</p>
    </section>
  </main>
  <script src="app.js?v=20260811-auth-4"></script>
  <script>
    const form = document.getElementById("loginForm");
    const codeInput = document.getElementById("accessCode");
    const status = document.getElementById("loginStatus");
    const button = document.getElementById("loginButton");
    const toggle = document.getElementById("toggleCode");
    const loginParams = new URL(window.location.href).searchParams;
    const next = GHEAuth.safeNextPath(loginParams.get("next"));
    if (loginParams.get("erreur") === "service") setStatus(status, "err", "Le service était momentanément inaccessible. Vous pouvez réessayer ici.");
    toggle.addEventListener("click", () => {
      const visible = codeInput.type === "text";
      codeInput.type = visible ? "password" : "text";
      toggle.textContent = visible ? "Afficher" : "Masquer";
      toggle.setAttribute("aria-pressed", String(!visible));
      toggle.setAttribute("aria-label", visible ? "Afficher le code" : "Masquer le code");
      codeInput.focus();
    });
    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
      status.className = "status";
      status.textContent = "";
    });
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      button.disabled = true;
      button.textContent = "Vérification…";
      setStatus(status, "warn", "Vérification du code…");
      try {
        await GHEAuth.loginWithCode(codeInput.value);
        setStatus(status, "ok", "✓ Accès autorisé.");
        window.location.replace(next);
      } catch (error) {
        codeInput.select();
        setStatus(status, "err", esc(error.message));
      } finally {
        button.disabled = false;
        button.textContent = "Se connecter";
      }
    });
    GHEAuth.existingSession().then(user => {
      if (!user) return;
      setStatus(status, "ok", `Déjà connecté : ${esc(user.display_name)}.`);
      window.location.replace(next);
    });
  </script>
</body>
</html>
