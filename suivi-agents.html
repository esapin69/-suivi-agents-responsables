<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi des nouveaux agents</title><link rel="stylesheet" href="style.css"></head><body><header class="app-header"><a class="back-link" href="index.html">←</a><div><p class="eyebrow">ESPACE RESPONSABLES</p><h1>Suivi des nouveaux agents</h1></div></header><main class="app-shell"><section class="toolbar"><div class="toolbar-row"><label class="search-box"><span>Rechercher un agent</span><input id="agent-search" type="search" placeholder="Nom, prénom ou matricule"></label><button id="new-agent" class="primary-button" type="button">Créer un agent</button></div></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">DOSSIERS</p><h2>Agents suivis</h2></div><span id="agent-count" class="count-badge">0</span></div><div id="agent-list" class="agent-list"></div></section><section id="agent-file" class="panel agent-file" hidden><div class="panel-heading"><div><p class="eyebrow">DOSSIER INDIVIDUEL</p><h2 id="agent-name">Agent</h2><p id="agent-meta" class="muted"></p></div><button id="close-file" class="secondary-button">Fermer</button></div><div class="tabs"><button class="tab active" data-tab="general">Fiche</button><button class="tab" data-tab="agent">Réponses agent</button><button class="tab" data-tab="evaluation">Évaluation</button><button class="tab" data-tab="synthese">Synthèse</button><button class="tab" data-tab="event">Événement</button></div><div class="tab-panel active" data-panel="general"><div class="information-grid"><label>Nom<input data-field="nom"></label><label>Prénom<input data-field="prenom"></label><label>Matricule<input data-field="matricule"></label><label>Date d’arrivée<input type="date" data-field="dateArrivee"></label><label>Équipe<select data-field="equipe"><option></option><option>Jour</option><option>Nuit</option></select></label><label>Type de contrat<input data-field="contrat"></label><label>Chef référent<input data-field="chefReferent"></label><label>Accompagnateur principal<input data-field="accompagnateur"></label></div></div><div class="tab-panel" data-panel="agent"><div id="agent-answers" class="answer-list"></div></div><div class="tab-panel" data-panel="evaluation"><div class="evaluation-head"><label>Étape concernée<select id="evaluation-stage" data-field="etape"><option>Premier jour</option><option>Première semaine</option><option>Fin de doublure</option><option>Suivi à un mois</option><option>Suivi à trois mois</option><option>Suivi à six mois</option></select></label><label>Professionnel réalisant le suivi<input data-field="evaluateur"></label><label>Fonction<select data-field="fonction"><option>Chef d’équipe</option><option>Cadre de santé</option><option>Tuteur ou compagnon</option><option>Autre professionnel habilité</option></select></label><label>Date du suivi<input type="date" data-field="dateSuivi"></label></div><div id="competence-grid" class="competence-grid"></div></div><div class="tab-panel" data-panel="synthese"><label class="response-field">Niveau général observé<select data-field="niveauGeneral"><option></option><option>Découverte</option><option>Accompagnement nécessaire</option><option>Progression satisfaisante</option><option>Autonomie partielle</option><option>Autonomie adaptée</option><option>Difficultés importantes</option></select></label><label class="response-field">Points forts observés<textarea data-field="pointsForts"></textarea></label><label class="response-field">Difficultés ou compétences restant à valider<textarea data-field="difficultes"></textarea></label><label class="response-field">Observations du responsable<textarea data-field="observationGenerale"></textarea></label><label class="response-field">Réponse ou position exprimée par l’agent<textarea data-field="reponseAgent"></textarea></label><label class="response-field">Action décidée<textarea data-field="action"></textarea></label><label class="response-field">Échéance prévue<input type="date" data-field="echeance"></label><label class="response-field">Statut du suivi<select data-field="statutSuivi"><option>À traiter</option><option>En cours</option><option>Terminé</option><option>Sans suite</option></select></label></div><div class="tab-panel" data-panel="event"><div class="information-grid"><label>Type d’événement<select data-field="typeEvenement"><option>Observation</option><option>Rendez-vous</option><option>Incident</option><option>Difficulté</option><option>Point positif</option><option>Demande de l’agent</option><option>Accompagnement</option><option>Rappel</option><option>Autre</option></select></label><label>Date de la situation<input type="date" data-field="dateEvenement"></label></div><label class="response-field">Observation ou objet<textarea data-field="objetEvenement"></textarea></label><label class="response-field">Réponse de l’agent<textarea data-field="reponseEvenement"></textarea></label><label class="response-field">Action à prévoir<textarea data-field="actionEvenement"></textarea></label></div><div class="save-bar"><p id="save-status"></p><button id="save-file" class="primary-button">Enregistrer le suivi</button></div></section></main><dialog id="new-agent-dialog"><form method="dialog" id="new-agent-form"><div class="dialog-head"><h2>Créer un agent</h2><button value="cancel" class="icon-button">×</button></div><div class="information-grid"><label>Nom<input name="nom" required></label><label>Prénom<input name="prenom" required></label><label>Matricule<input name="matricule"></label><label>Date d’arrivée<input type="date" name="dateArrivee" required></label><label>Équipe<select name="equipe"><option></option><option>Jour</option><option>Nuit</option></select></label><label>Chef référent<input name="chefReferent"></label></div><div id="duplicate-warning" class="warning" hidden></div><div class="dialog-actions"><button value="cancel" class="secondary-button">Annuler</button><button id="create-agent" value="default" class="primary-button">Créer le dossier</button></div></form></dialog><script src="app.js"></script></body></html>
