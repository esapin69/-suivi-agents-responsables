name: QA performance and concurrency

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install QA dependencies
        run: npm ci --prefix backend

      - name: Check JavaScript syntax
        run: |
          node --check data-cache.js
          node --check cloudflare/index.js

      - name: Run security, concurrency and architecture tests
        run: node --test architecture-consistency.test.cjs site-security.test.cjs apps-script/security.test.cjs

      - name: Validate Worker build
        run: ./backend/node_modules/.bin/wrangler deploy --dry-run --config backend/wrangler.jsonc

      - name: Check repository cleanliness
        run: git diff --check
