name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
      SESSION_SECRET: "secret-de-test-ci-uniquement-0123456789abcdef"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: cloudflare
      - run: npm run typecheck
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      - run: npx wrangler types --include-runtime false --check
        working-directory: cloudflare
      - name: Vérifier le bundle Worker
        run: npx esbuild src/index.ts --bundle --format=esm --platform=browser --target=es2024 --loader:.sql=text --outfile=/tmp/ghe-worker-build.js
        working-directory: cloudflare
